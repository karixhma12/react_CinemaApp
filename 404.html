<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      var path = window.location.pathname;
      var base = '/react_CinemaApp';

      sessionStorage.setItem('redirect', newPath);
      window.location.replace(base);
    </script>
  </head>
</html>
